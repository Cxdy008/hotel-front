<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelManager - Recepção</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.10/main.min.js'></script>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard-reception.css">
</head>
<body>
    <div class="reception-dashboard-container">
        <!-- Sidebar -->
        <aside class="reception-sidebar">
            <div class="reception-sidebar-header">
                <h1>Recepção</h1>
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="reception-user-info">
                <div class="reception-avatar">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="reception-details">
                    <h3 id="receptionistName">Recepcionista</h3>
                    <p id="receptionistEmail">recepcao@hotelmanager.co.ao</p>
                </div>
            </div>

            <nav class="reception-nav">
                <ul>
                    <li class="reception-nav-item active" data-page="checkin-checkout">
                        <i class="fas fa-clipboard-check"></i>
                        <span>Check-in/Check-out</span>
                    </li>
                    <li class="reception-nav-item" data-page="manual-reservation">
                        <i class="fas fa-book"></i>
                        <span>Cadastro de Reservas</span>
                    </li>
                    <li class="reception-nav-item" data-page="guest-registration">
                        <i class="fas fa-user-plus"></i>
                        <span>Cadastro de Hóspedes</span>
                    </li>
                    <li class="reception-nav-item" data-page="occupation-calendar">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Calendário de Ocupação</span>
                    </li>
                </ul>
            </nav>

            <div class="reception-sidebar-footer">
                <button id="receptionLogoutBtn" class="reception-logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="reception-main-content">
            <header class="reception-header">
                <div class="header-left">
                    <h2 id="pageTitle">Check-in/Check-out</h2>
                </div>
                <div class="header-right">
                    <div class="reception-search">
                        <input type="text" placeholder="Buscar reserva ou hóspede...">
                        <i class="fas fa-search"></i>
                    </div>
                    <div class="reception-notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">2</span>
                    </div>
                </div>
            </header>

            <!-- Áreas de Conteúdo -->
            <div class="reception-content-area">
                <!-- Check-in/Check-out -->
                <section id="checkin-checkout" class="reception-page active">
                    <div class="daily-reservations">
                        <div class="section-header">
                            <h3>Reservas do Dia</h3>
                            <div class="date-selector">
                                <button class="date-nav prev"><i class="fas fa-chevron-left"></i></button>
                                <span id="currentDate">22 de Março, 2024</span>
                                <button class="date-nav next"><i class="fas fa-chevron-right"></i></button>
                            </div>
                        </div>
                        <div class="reservations-list">
                            <!-- Lista de reservas será preenchida via JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Cadastro de Reservas -->
                <section id="manual-reservation" class="reception-page">
                    <div class="reservation-form-container">
                        <h3>Nova Reserva</h3>
                        <form id="manualReservationForm">
                            <div class="form-group">
                                <label>Hóspede</label>
                                <input type="text" placeholder="Buscar hóspede...">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Check-in</label>
                                    <input type="date">
                                </div>
                                <div class="form-group">
                                    <label>Check-out</label>
                                    <input type="date">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Quarto</label>
                                <select>
                                    <option value="">Selecione um quarto...</option>
                                </select>
                            </div>
                            <button type="submit" class="submit-btn">Criar Reserva</button>
                        </form>
                    </div>
                </section>

                <!-- Cadastro de Hóspedes -->
                <section id="guest-registration" class="reception-page">
                    <div class="guest-form-container">
                        <h3>Novo Hóspede</h3>
                        <form id="guestRegistrationForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Nome Completo</label>
                                    <input type="text" required>
                                </div>
                                <div class="form-group">
                                    <label>Documento</label>
                                    <input type="text" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" required>
                                </div>
                                <div class="form-group">
                                    <label>Telefone</label>
                                    <input type="tel" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Endereço</label>
                                <input type="text">
                            </div>
                            <button type="submit" class="submit-btn">Cadastrar Hóspede</button>
                        </form>
                    </div>
                </section>

                <!-- Calendário de Ocupação -->
                <section id="occupation-calendar" class="reception-page">
                    <div class="calendar-container">
                        <div id="occupationCalendar"></div>
                        <div class="calendar-legend">
                            <div class="legend-item">
                                <span class="legend-color occupied"></span>
                                <span>Ocupado</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color available"></span>
                                <span>Disponível</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color maintenance"></span>
                                <span>Manutenção</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div class="reception-toast-container" id="receptionToastContainer"></div>

    <!-- JavaScript -->
    <script src="../js/dashboard-reception.js"></script>
</body>
</html>
