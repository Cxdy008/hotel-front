<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelManager - Área do Hóspede</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard-guest.css">
</head>
<body>
    <div class="guest-dashboard-container">
        <!-- Sidebar -->
        <aside class="guest-sidebar">
            <div class="guest-sidebar-header">
                <h1>Minha Conta</h1>
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="guest-user-info">
                <div class="guest-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="guest-details">
                    <h3 id="guestName">João Silva</h3>
                    <p id="guestEmail">joao@email.com</p>
                </div>
            </div>

            <nav class="guest-nav">
                <ul>
                    <li class="guest-nav-item active" data-page="my-reservations">
                        <i class="fas fa-list"></i>
                        <span>Minhas Reservas</span>
                    </li>
                    <li class="guest-nav-item" data-page="new-reservation">
                        <i class="fas fa-plus-circle"></i>
                        <span>Nova Reserva</span>
                    </li>
                    <li class="guest-nav-item" data-page="profile">
                        <i class="fas fa-user-edit"></i>
                        <span>Meu Perfil</span>
                    </li>
                </ul>
            </nav>

            <div class="guest-sidebar-footer">
                <button id="guestLogoutBtn" class="guest-logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="guest-main-content">
            <header class="guest-header">
                <div class="header-left">
                    <h2 id="pageTitle">Minhas Reservas</h2>
                </div>
                <div class="header-right">
                    <div class="guest-notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">1</span>
                    </div>
                </div>
            </header>

            <!-- Áreas de Conteúdo -->
            <div class="guest-content-area">
                <!-- Minhas Reservas -->
                <section id="my-reservations" class="guest-page active">
                    <div class="reservations-container">
                        <div class="reservations-filters">
                            <div class="filter-group">
                                <label>Status</label>
                                <select id="reservationStatusFilter">
                                    <option value="all">Todas</option>
                                    <option value="ACTIVE">Activas</option>
                                    <option value="CANCELLED">Canceladas</option>
                                    <option value="COMPLETED">Completas</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Ordenar por</label>
                                <select id="reservationSortFilter">
                                    <option value="date-desc">Data (mais recente)</option>
                                    <option value="date-asc">Data (mais antiga)</option>
                                </select>
                            </div>
                        </div>
                        <div class="reservations-list">
                            <!-- Lista de reservas será preenchida via JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Nova Reserva -->
                <section id="new-reservation" class="guest-page">
                    <div class="new-reservation-container">
                        <form class="search-filters" onsubmit="return false;">
                            <div class="date-picker">
                                <div class="form-group">
                                    <label>Check-in</label>
                                    <input type="date" id="checkInDate">
                                </div>
                                <div class="form-group">
                                    <label>Check-out</label>
                                    <input type="date" id="checkOutDate">
                                </div>
                            </div>
                            <div class="room-filters">
                                <div class="form-group">
                                    <label>Tipo de Quarto</label>
                                    <select id="roomTypeFilter">
                                        <option value="all">TODOS DISPONÍVEIS</option>
                                        <option value="STANDARD">STANDARD</option>
                                        <option value="LUXO">LUXO</option>
                                        <option value="SUITE">SUITE</option>
                                    </select>
                                </div>
                                <button type="button" class="search-btn">Buscar Quartos</button>
                            </div>
                        </form>
                        <div class="available-rooms">
                            <!-- Lista de quartos disponíveis será preenchida via JavaScript -->
                        </div>
                        <div class="reservation-submit-container" style="display: none;">
                            <button type="button" class="submit-reservation-btn" disabled>
                                Confirmar Reserva
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Perfil -->
                <section id="profile" class="guest-page">
                    <div class="profile-container">
                        <div class="profile-header">
                            <div class="profile-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="profile-info">
                                <h3>Dados Pessoais</h3>
                                <p>Mantenha seus dados sempre atualizados</p>
                            </div>
                        </div>
                        <div class="profile-data">
                            <div class="data-row">
                                <span class="data-label">Nome:</span>
                                <span id="profileName" class="data-value"></span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">Email:</span>
                                <span id="profileEmail" class="data-value"></span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">Telefone:</span>
                                <span id="profilePhone" class="data-value"></span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">Documento:</span>
                                <span id="profileDocument" class="data-value"></span>
                            </div>
                        </div>
                        <div class="profile-actions">
                            <button class="update-profile-btn" onclick="openUpdateProfileModal()">
                                <i class="fas fa-edit"></i>
                                Atualizar Perfil
                            </button>
                            <button class="update-password-btn" onclick="openUpdatePasswordModal()">
                                <i class="fas fa-key"></i>
                                Atualizar Senha
                            </button>
                            <button class="delete-profile-btn" onclick="confirmDeleteProfile()">
                                <i class="fas fa-trash"></i>
                                Apagar Perfil
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Modal de Atualização de Perfil -->
                <div class="profile-modal" id="updateProfileModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Atualizar Perfil</h3>
                            <button class="close-modal" onclick="closeUpdateProfileModal()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="modal-body">
                            <form id="updateProfileForm">
                                <input type="hidden" id="profileId">
                                <div class="form-group">
                                    <label for="updateName">Nome</label>
                                    <input type="text" id="updateName" required>
                                </div>
                                <div class="form-group">
                                    <label for="updatePhone">Telefone</label>
                                    <input type="tel" id="updatePhone" required>
                                </div>
                                <div class="form-group">
                                    <label for="updateDocument">Documento</label>
                                    <input type="text" id="updateDocument" required>
                                </div>
                                <div class="modal-actions">
                                    <button type="button" class="cancel-modal-btn" onclick="closeUpdateProfileModal()">Cancelar</button>
                                    <button type="submit" class="update-btn">Atualizar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Modal de Atualização de Senha -->
                <div class="profile-modal" id="updatePasswordModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Atualizar Senha</h3>
                            <button class="close-modal" onclick="closeUpdatePasswordModal()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="modal-body">
                            <form id="updatePasswordForm">
                                <div class="form-group">
                                    <label for="currentPassword">Senha Atual</label>
                                    <input type="password" id="currentPassword" required>
                                </div>
                                <div class="form-group">
                                    <label for="newPassword">Nova Senha</label>
                                    <input type="password" id="newPassword" required>
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Confirmar Nova Senha</label>
                                    <input type="password" id="confirmPassword" required>
                                </div>
                                <div class="modal-actions">
                                    <button type="button" class="cancel-modal-btn" onclick="closeUpdatePasswordModal()">Cancelar</button>
                                    <button type="submit" class="update-btn">Atualizar Senha</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div class="guest-toast-container" id="guestToastContainer"></div>

    <!-- Modal de Atualização de Reserva -->
    <div class="update-reservation-modal" id="updateReservationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Atualizar Reserva</h3>
                <button class="close-modal" onclick="closeUpdateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="updateReservationForm">
                    <input type="hidden" id="updateReservationId">
                    <div class="form-group">
                        <label for="updateCheckIn">Check-in</label>
                        <input type="date" id="updateCheckIn" required>
                    </div>
                    <div class="form-group">
                        <label for="updateCheckOut">Check-out</label>
                        <input type="date" id="updateCheckOut" required>
                    </div>
                    <div class="form-group">
                        <label for="updateRoomType">Tipo de Quarto</label>
                        <select id="updateRoomType" required>
                            <option value="all">TODOS DISPONÍVEIS</option>
                            <option value="STANDARD">STANDARD</option>
                            <option value="LUXO">LUXO</option>
                            <option value="SUITE">SUITE</option>
                        </select>
                    </div>
                    <div class="available-rooms-modal">
                        <!-- Lista de quartos disponíveis será preenchida via JavaScript -->
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="search-rooms-btn" onclick="searchAvailableRoomsForUpdate()">
                            <i class="fas fa-search"></i>
                            Buscar Quartos
                        </button>
                        <button type="button" class="cancel-modal-btn" onclick="closeUpdateModal()">Cancelar</button>
                        <button type="submit" class="update-btn" disabled>Atualizar Reserva</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="../js/dashboard-guest.js"></script>
</body>
</html>
