<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HotelManager - Área do Hóspede</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/dashboard-guest.css">
</head>
<body>
    <div class="guest-dashboard-container">
        <!-- Sidebar -->
        <aside class="guest-sidebar">
            <div class="guest-sidebar-header">
                <h1>Minha Conta</h1>
                <button id="toggleSidebar" class="toggle-sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="guest-user-info">
                <div class="guest-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="guest-details">
                    <h3 id="guestName">João Silva</h3>
                    <p id="guestEmail">joao@email.com</p>
                </div>
            </div>

            <nav class="guest-nav">
                <ul>
                    <li class="guest-nav-item active" data-page="my-reservations">
                        <i class="fas fa-list"></i>
                        <span>Minhas Reservas</span>
                    </li>
                    <li class="guest-nav-item" data-page="new-reservation">
                        <i class="fas fa-plus-circle"></i>
                        <span>Nova Reserva</span>
                    </li>
                    <li class="guest-nav-item" data-page="profile">
                        <i class="fas fa-user-edit"></i>
                        <span>Meu Perfil</span>
                    </li>
                </ul>
            </nav>

            <div class="guest-sidebar-footer">
                <button id="guestLogoutBtn" class="guest-logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="guest-main-content">
            <header class="guest-header">
                <div class="header-left">
                    <h2 id="pageTitle">Minhas Reservas</h2>
                </div>
                <div class="header-right">
                    <div class="guest-notifications">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">1</span>
                    </div>
                </div>
            </header>

            <!-- Áreas de Conteúdo -->
            <div class="guest-content-area">
                <!-- Minhas Reservas -->
                <section id="my-reservations" class="guest-page active">
                    <div class="reservations-container">
                        <div class="reservations-filters">
                            <div class="filter-group">
                                <label>Status</label>
                                <select id="reservationStatusFilter">
                                    <option value="all">Todas</option>
                                    <option value="upcoming">Próximas</option>
                                    <option value="past">Passadas</option>
                                    <option value="cancelled">Canceladas</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Ordenar por</label>
                                <select id="reservationSortFilter">
                                    <option value="date-desc">Data (mais recente)</option>
                                    <option value="date-asc">Data (mais antiga)</option>
                                </select>
                            </div>
                        </div>
                        <div class="reservations-list">
                            <!-- Lista de reservas será preenchida via JavaScript -->
                        </div>
                    </div>
                </section>

                <!-- Nova Reserva -->
                <section id="new-reservation" class="guest-page">
                    <div class="new-reservation-container">
                        <form class="search-filters" onsubmit="return false;">
                            <div class="date-picker">
                                <div class="form-group">
                                    <label>Check-in</label>
                                    <input type="date" id="checkInDate">
                                </div>
                                <div class="form-group">
                                    <label>Check-out</label>
                                    <input type="date" id="checkOutDate">
                                </div>
                            </div>
                            <div class="room-filters">
                                <div class="form-group">
                                    <label>Tipo de Quarto</label>
                                    <select id="roomTypeFilter">
                                        <option value="all">Todos os tipos</option>
                                        <option value="STANDARD">STANDARD</option>
                                        <option value="LUXO">LUXO</option>
                                        <option value="SUITE">SUITE</option>
                                    </select>
                                </div>
                                <button type="button" class="search-btn">Buscar Quartos</button>
                            </div>
                        </form>
                        <div class="available-rooms">
                            <!-- Lista de quartos disponíveis será preenchida via JavaScript -->
                        </div>
                        <div class="reservation-submit-container" style="display: none;">
                            <button type="button" class="submit-reservation-btn" disabled>
                                Confirmar Reserva
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Perfil -->
                <section id="profile" class="guest-page">
                    <div class="profile-container">
                        <div class="profile-header">
                            <div class="profile-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="profile-info">
                                <h3>Dados Pessoais</h3>
                                <p>Mantenha seus dados sempre atualizados</p>
                            </div>
                        </div>
                        <form id="profileForm" class="profile-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Nome Completo</label>
                                    <input type="text" id="fullName" name="fullName" required>
                                </div>
                                <div class="form-group">
                                    <label>Documento</label>
                                    <input type="text" id="document" name="document" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="email" name="email" required>
                                </div>
                                <div class="form-group">
                                    <label>Telefone</label>
                                    <input type="tel" id="phone" name="phone" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Endereço</label>
                                <input type="text" id="address" name="address">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="save-btn">Salvar Alterações</button>
                            </div>
                        </form>
                        <div class="password-section">
                            <h3>Alterar Senha</h3>
                            <form id="passwordForm" class="password-form">
                                <div class="form-group">
                                    <label>Senha Atual</label>
                                    <input type="password" name="currentPassword" required>
                                </div>
                                <div class="form-group">
                                    <label>Nova Senha</label>
                                    <input type="password" name="newPassword" required>
                                </div>
                                <div class="form-group">
                                    <label>Confirmar Nova Senha</label>
                                    <input type="password" name="confirmPassword" required>
                                </div>
                                <button type="submit" class="change-password-btn">Alterar Senha</button>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div class="guest-toast-container" id="guestToastContainer"></div>

    <!-- JavaScript -->
    <script src="../js/dashboard-guest.js"></script>
</body>
</html>
